<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Astrolab spinner — dönen astronomik aletin stilize hali -->
  <g stroke="#C9A24B" fill="none" stroke-width="1.5">
    <!-- Dış halka (sabit) -->
    <circle cx="32" cy="32" r="28" />

    <!-- İç halka 1 (dönen) -->
    <g>
      <circle cx="32" cy="32" r="22" stroke-dasharray="4 4" />
      <animateTransform attributeName="transform" type="rotate"
                        from="0 32 32" to="360 32 32" dur="6s" repeatCount="indefinite" />
    </g>

    <!-- İç halka 2 (ters yön) -->
    <g>
      <circle cx="32" cy="32" r="16" stroke-dasharray="2 6" />
      <animateTransform attributeName="transform" type="rotate"
                        from="360 32 32" to="0 32 32" dur="4s" repeatCount="indefinite" />
    </g>

    <!-- Merkez -->
    <circle cx="32" cy="32" r="4" fill="#C9A24B" />

    <!-- Yıldız işaretleri (4 yön) -->
    <g fill="#C9A24B">
      <circle cx="32" cy="4" r="2" />
      <circle cx="60" cy="32" r="2" />
      <circle cx="32" cy="60" r="2" />
      <circle cx="4" cy="32" r="2" />
    </g>

    <!-- Çapraz işaretler (45°) -->
    <g fill="#8B6914">
      <circle cx="52" cy="12" r="1.5" />
      <circle cx="52" cy="52" r="1.5" />
      <circle cx="12" cy="52" r="1.5" />
      <circle cx="12" cy="12" r="1.5" />
    </g>
  </g>
</svg>
