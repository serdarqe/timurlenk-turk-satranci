<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="girih" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Merkezi sekiz köşeli yıldız (Timur / Selçuklu motifi) -->
      <g fill="none" stroke="#C9A24B" stroke-width="0.6" opacity="0.4">
        <!-- Sekiz köşeli yıldız -->
        <path d="M60,30 L70,50 L90,50 L75,65 L82,85 L60,75 L38,85 L45,65 L30,50 L50,50 Z" />
        <!-- İç sekizgen -->
        <polygon points="60,42 75,50 75,65 60,73 45,65 45,50" />
        <!-- Köşelere küçük yıldızlar -->
        <circle cx="0" cy="0" r="2" />
        <circle cx="120" cy="0" r="2" />
        <circle cx="0" cy="120" r="2" />
        <circle cx="120" cy="120" r="2" />
        <!-- Köşegen bağlantı çizgileri -->
        <line x1="0" y1="0" x2="30" y2="50" />
        <line x1="120" y1="0" x2="90" y2="50" />
        <line x1="0" y1="120" x2="30" y2="50" />
        <line x1="120" y1="120" x2="90" y2="50" />
        <line x1="30" y1="50" x2="45" y2="65" />
        <line x1="90" y1="50" x2="75" y2="65" />
      </g>
    </pattern>
  </defs>
  <rect width="240" height="240" fill="url(#girih)" />
</svg>
