<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Tuğra/Mühür motifi — soyut padişah mührü stilizasyonu -->
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#8B6914" />
    </radialGradient>
  </defs>

  <!-- Dış halka -->
  <circle cx="40" cy="40" r="36" fill="url(#sealBg)" stroke="#2C2118" stroke-width="1.5" />

  <!-- İç ince halka -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="#2C2118" stroke-width="0.8" />

  <!-- Merkezi kufic-stil sembol (T harfi stilizasyonu) -->
  <g fill="#2C2118" stroke="#2C2118" stroke-width="0.5">
    <!-- Üst hilal -->
    <path d="M28,30 Q40,22 52,30 L52,34 Q40,28 28,34 Z" />
    <!-- Dikey gövde -->
    <rect x="38" y="32" width="4" height="18" />
    <!-- Alt yarım daire -->
    <path d="M30,50 Q40,58 50,50 L50,52 Q40,60 30,52 Z" />
    <!-- Yıldız tepe -->
    <circle cx="40" cy="22" r="2" />
  </g>

  <!-- 4 köşede küçük noktalar -->
  <g fill="#2C2118">
    <circle cx="40" cy="10" r="1.5" />
    <circle cx="70" cy="40" r="1.5" />
    <circle cx="40" cy="70" r="1.5" />
    <circle cx="10" cy="40" r="1.5" />
  </g>
</svg>
