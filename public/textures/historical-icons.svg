<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <!-- Historical Icon Set — Faz 2 -->
  <!-- Kullanım: <svg class="hist-icon"><use href="/textures/historical-icons.svg#icon-name"/></svg> -->

  <!-- 1. icon-bolt — Hızlı Başlat (şahin silüeti / şimşek hibridi) -->
  <symbol id="icon-bolt" viewBox="0 0 24 24">
    <path fill="currentColor" d="M13 2 L4 14 L11 14 L9 22 L20 9 L13 9 Z" />
  </symbol>

  <!-- 2. icon-play — Yeni Oyun (açılmış kılıç) -->
  <symbol id="icon-play" viewBox="0 0 24 24">
    <!-- Kılıç gövdesi -->
    <path fill="currentColor" stroke="currentColor" stroke-width="0.5"
          d="M12 2 L13 4 L13 16 L15 17 L15 19 L13 19 L13 22 L11 22 L11 19 L9 19 L9 17 L11 16 L11 4 Z" />
    <!-- Kabza süsü -->
    <circle cx="12" cy="18" r="1.5" fill="currentColor" />
  </symbol>

  <!-- 3. icon-gamepad — Oynayarak Öğren (oyun pad'inin tarihsel hali — at oyun karakteri) -->
  <symbol id="icon-gamepad" viewBox="0 0 24 24">
    <!-- Stilize at başı -->
    <path fill="currentColor"
          d="M6 18 L7 12 Q7 9 9 7 L11 5 Q13 3 14 5 L15 7 L17 7 L18 9 L17 11 L17 18 L14 18 L14 14 L11 14 L11 18 Z" />
    <!-- Göz -->
    <circle cx="13" cy="9" r="0.8" fill="white" />
  </symbol>

  <!-- 4. icon-book-open — Öğretici Rehber (açılmış yazma kitap) -->
  <symbol id="icon-book-open" viewBox="0 0 24 24">
    <path fill="currentColor" stroke="currentColor" stroke-width="0.3"
          d="M3 5 L11 6 L11 20 L3 19 Z M13 6 L21 5 L21 19 L13 20 Z" />
    <!-- Sayfa çizgileri -->
    <g stroke="white" stroke-width="0.3" opacity="0.4">
      <line x1="5" y1="8" x2="9" y2="8.3" />
      <line x1="5" y1="11" x2="9" y2="11.3" />
      <line x1="5" y1="14" x2="9" y2="14.3" />
      <line x1="15" y1="8.3" x2="19" y2="8" />
      <line x1="15" y1="11.3" x2="19" y2="11" />
      <line x1="15" y1="14.3" x2="19" y2="14" />
    </g>
  </symbol>

  <!-- 5. icon-puzzle — Satranç Bulmacaları (tılsım / mühür) -->
  <symbol id="icon-puzzle" viewBox="0 0 24 24">
    <!-- Sekiz köşeli yıldız (tılsım) -->
    <path fill="currentColor" stroke="currentColor" stroke-width="0.4"
          d="M12 2 L14 7 L19 5 L17 10 L22 12 L17 14 L19 19 L14 17 L12 22 L10 17 L5 19 L7 14 L2 12 L7 10 L5 5 L10 7 Z" />
    <!-- Merkez nokta -->
    <circle cx="12" cy="12" r="2" fill="white" opacity="0.7" />
  </symbol>

  <!-- 6. icon-scroll — Maç Geçmişi (açılmış parşömen rulosu) -->
  <symbol id="icon-scroll" viewBox="0 0 24 24">
    <!-- Üst rulo -->
    <ellipse cx="6" cy="6" rx="3" ry="2" fill="currentColor" />
    <!-- Parşömen -->
    <path fill="currentColor" stroke="currentColor" stroke-width="0.3"
          d="M6 6 L18 6 L18 18 L6 18 Z" opacity="0.85" />
    <!-- Alt rulo -->
    <ellipse cx="18" cy="18" rx="3" ry="2" fill="currentColor" />
    <!-- Satır çizgileri -->
    <g stroke="white" stroke-width="0.5" opacity="0.5">
      <line x1="8" y1="9" x2="16" y2="9" />
      <line x1="8" y1="12" x2="16" y2="12" />
      <line x1="8" y1="15" x2="14" y2="15" />
    </g>
  </symbol>

  <!-- 7. icon-globe — Çevrimiçi (İpek Yolu haritası — basit kıta + meridyenler) -->
  <symbol id="icon-globe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" />
    <!-- Meridyenler -->
    <ellipse cx="12" cy="12" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="0.8" />
    <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="0.8" />
    <!-- İpek Yolu rota işareti (yıldızlar) -->
    <g fill="currentColor">
      <circle cx="8" cy="10" r="1" />
      <circle cx="12" cy="8" r="0.8" />
      <circle cx="16" cy="11" r="1" />
      <circle cx="14" cy="15" r="0.8" />
    </g>
  </symbol>

  <!-- 8. icon-crown — Karakter (Timur — taç) -->
  <symbol id="icon-crown" viewBox="0 0 24 24">
    <path fill="currentColor" stroke="currentColor" stroke-width="0.4"
          d="M3 17 L4 9 L8 12 L12 6 L16 12 L20 9 L21 17 Z M3 19 L21 19 L21 21 L3 21 Z" />
    <!-- Mücevherler -->
    <g fill="white" opacity="0.7">
      <circle cx="4" cy="11" r="0.6" />
      <circle cx="12" cy="8" r="0.8" />
      <circle cx="20" cy="11" r="0.6" />
    </g>
  </symbol>

  <!-- 9. icon-cog — Ayarlar (astrolab) -->
  <symbol id="icon-cog" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" fill="currentColor" />
    <g fill="currentColor">
      <path d="M11 1 L13 1 L13 4 L11 4 Z" />
      <path d="M11 20 L13 20 L13 23 L11 23 Z" />
      <path d="M1 11 L4 11 L4 13 L1 13 Z" />
      <path d="M20 11 L23 11 L23 13 L20 13 Z" />
      <path d="M3.5 4.5 L5 3 L7 5 L5.5 6.5 Z" />
      <path d="M17 5 L19 3 L20.5 4.5 L18.5 6.5 Z" />
      <path d="M3.5 19.5 L5.5 17.5 L7 19 L5 21 Z" />
      <path d="M17 19 L18.5 17.5 L20.5 19.5 L19 21 Z" />
    </g>
  </symbol>

  <!-- 10. icon-times — Kapat (hilal + yıldız değil, klasik X — daha temiz) -->
  <symbol id="icon-times" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          d="M6 6 L18 18 M18 6 L6 18" />
  </symbol>

  <!-- 11. icon-chevron-right — Sağ ok (devam) -->
  <symbol id="icon-chevron-right" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          d="M9 6 L15 12 L9 18" />
  </symbol>

  <!-- 12. icon-chevron-left — Sol ok (geri) -->
  <symbol id="icon-chevron-left" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          d="M15 6 L9 12 L15 18" />
  </symbol>

  <!-- 13. icon-robot — Botlara karşı oyna -->
  <symbol id="icon-robot" viewBox="0 0 24 24">
    <!-- Baş -->
    <rect x="5" y="6" width="14" height="12" rx="2" fill="currentColor" />
    <!-- Anten -->
    <line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="1.5" />
    <circle cx="12" cy="2" r="1" fill="currentColor" />
    <!-- Gözler -->
    <circle cx="9" cy="11" r="1.5" fill="white" />
    <circle cx="15" cy="11" r="1.5" fill="white" />
    <!-- Ağız çizgisi -->
    <rect x="9" y="14" width="6" height="1.5" fill="white" />
  </symbol>
</svg>
