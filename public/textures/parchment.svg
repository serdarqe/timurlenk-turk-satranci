<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Parşömen dokusu — fiber + leke + yıpranma -->
  <defs>
    <!-- Hafif gradient: kenarlar daha koyu, merkez açık -->
    <radialGradient id="parchBase" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F4E8C8" />
      <stop offset="70%" stop-color="#EDDCB0" />
      <stop offset="100%" stop-color="#D8C490" />
    </radialGradient>

    <!-- Fiber dokusu — SVG filter noise -->
    <filter id="paperGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" />
      <feColorMatrix values="0 0 0 0 0.55
                             0 0 0 0 0.42
                             0 0 0 0 0.25
                             0 0 0 0.08 0" />
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>

    <filter id="agedSpots">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" seed="7" />
      <feColorMatrix values="0 0 0 0 0.45
                             0 0 0 0 0.30
                             0 0 0 0 0.15
                             0 0 0 0.12 0" />
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>
  </defs>

  <!-- Ana parşömen -->
  <rect width="512" height="512" fill="url(#parchBase)" />

  <!-- Fiber dokusu üst tabaka -->
  <rect width="512" height="512" filter="url(#paperGrain)" opacity="0.7" />

  <!-- Yaşlanma lekeleri -->
  <rect width="512" height="512" filter="url(#agedSpots)" opacity="0.5" />

  <!-- Köşelerde hafif yıpranma efekti -->
  <g fill="#8B6914" opacity="0.08">
    <circle cx="20" cy="20" r="40" />
    <circle cx="492" cy="20" r="40" />
    <circle cx="20" cy="492" r="40" />
    <circle cx="492" cy="492" r="40" />
  </g>
</svg>
