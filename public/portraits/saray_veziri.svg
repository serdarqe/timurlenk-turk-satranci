<?xml version="1.0" encoding="UTF-8"?>
<!-- Saray Veziri — Komutan Portresi (minyatür stili)
     Sakin savunmacı: yeşil/zümrüt kaftan, kalkan sembolü. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Saray Veziri portresi">
  <defs>
    <radialGradient id="v-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F4E8C8"/>
      <stop offset="60%" stop-color="#E8D5A0"/>
      <stop offset="100%" stop-color="#C9A876"/>
    </radialGradient>
    <linearGradient id="v-robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6B4A"/>
      <stop offset="100%" stop-color="#0E4A2E"/>
    </linearGradient>
    <linearGradient id="v-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0C770"/>
      <stop offset="100%" stop-color="#9C7820"/>
    </linearGradient>
  </defs>

  <!-- Tezhip çerçeve -->
  <circle cx="48" cy="48" r="46" fill="url(#v-bg)" stroke="#9C7820" stroke-width="2"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="#C9A24B" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Robe / Kaftan (zümrüt) -->
  <path d="M16,96 Q16,68 30,60 L66,60 Q80,68 80,96 Z" fill="url(#v-robe)" stroke="#063A23" stroke-width="1"/>
  <!-- Süs deseni (arabesk) -->
  <path d="M30,72 Q48,76 66,72" fill="none" stroke="#C9A24B" stroke-width="1.2"/>
  <path d="M28,82 Q48,86 68,82" fill="none" stroke="#C9A24B" stroke-width="0.9"/>

  <!-- Kalkan (sağ omuzda) -->
  <g transform="translate(72,62)">
    <path d="M-6,-6 L6,-6 L6,2 Q0,8 -6,2 Z" fill="url(#v-shield)" stroke="#7A5A18" stroke-width="0.8"/>
    <path d="M-3,-3 L3,-3 L3,0 Q0,3 -3,0 Z" fill="none" stroke="#5B1616" stroke-width="0.6"/>
  </g>

  <!-- Yüz -->
  <ellipse cx="48" cy="45" rx="15" ry="17" fill="#E5C5A0" stroke="#8B5A2B" stroke-width="0.6"/>
  <!-- Sakal (uzun, kalın, vakar) -->
  <path d="M36,52 Q40,68 48,72 Q56,68 60,52 Q56,56 48,57 Q40,56 36,52 Z" fill="#4A3A28" stroke="#2A1E14" stroke-width="0.4"/>
  <!-- Bıyık -->
  <path d="M40,48 Q44,46 48,47 Q52,46 56,48" fill="none" stroke="#4A3A28" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Gözler (sakin, derin) -->
  <ellipse cx="42" cy="42" rx="1.5" ry="0.9" fill="#1A0E08"/>
  <ellipse cx="54" cy="42" rx="1.5" ry="0.9" fill="#1A0E08"/>
  <!-- Kaşlar (yumuşak, bilge) -->
  <path d="M39,38.5 L46,39.5" stroke="#2A1E14" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M50,39.5 L57,38.5" stroke="#2A1E14" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Burun -->
  <path d="M48,42 L47,49 L49,49" fill="none" stroke="#8B5A2B" stroke-width="0.6"/>

  <!-- Sarık (büyük, yeşil — Vezir mertebesi) -->
  <path d="M30,32 Q48,14 66,32 Q60,24 48,22 Q36,24 30,32 Z" fill="#1F6B4A" stroke="#063A23" stroke-width="0.8"/>
  <!-- Sarık üst süslemesi -->
  <path d="M44,22 Q48,18 52,22" fill="none" stroke="#F0C770" stroke-width="1" stroke-linecap="round"/>
  <!-- Sarık mücevheri (zümrüt) -->
  <ellipse cx="48" cy="24" rx="2.2" ry="1.6" fill="#0E4A2E" stroke="#C9A24B" stroke-width="0.5"/>

  <!-- Mühür imzası -->
  <text x="20" y="92" font-family="serif" font-size="6" fill="#9C7820" opacity="0.6">۞</text>
</svg>
