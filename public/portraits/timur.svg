<?xml version="1.0" encoding="UTF-8"?>
<!-- Timur (Timurlenk) — Komutan Portresi (minyatür stili)
     Hâkim ve baskıcı: altın taç, kırmızı kaftan, koyu sakal. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Timur portresi">
  <defs>
    <radialGradient id="t-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F4E8C8"/>
      <stop offset="60%" stop-color="#E8D5A0"/>
      <stop offset="100%" stop-color="#C9A876"/>
    </radialGradient>
    <linearGradient id="t-robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="100%" stop-color="#5B1616"/>
    </linearGradient>
    <linearGradient id="t-crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0C770"/>
      <stop offset="100%" stop-color="#9C7820"/>
    </linearGradient>
  </defs>

  <!-- Tezhip çerçeve -->
  <circle cx="48" cy="48" r="46" fill="url(#t-bg)" stroke="#9C7820" stroke-width="2"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="#C9A24B" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Robe / Kaftan -->
  <path d="M16,96 Q16,68 30,60 L66,60 Q80,68 80,96 Z" fill="url(#t-robe)" stroke="#3A0D0D" stroke-width="1"/>
  <!-- Kaftan altın şeritleri -->
  <path d="M30,72 Q48,76 66,72" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
  <path d="M28,82 Q48,86 68,82" fill="none" stroke="#C9A24B" stroke-width="1"/>

  <!-- Yüz -->
  <ellipse cx="48" cy="45" rx="15" ry="17" fill="#E5C5A0" stroke="#8B5A2B" stroke-width="0.6"/>
  <!-- Sakal (uzun, dik) -->
  <path d="M38,52 Q40,68 48,72 Q56,68 58,52 Q56,56 48,57 Q40,56 38,52 Z" fill="#2A1810" stroke="#1A0E08" stroke-width="0.4"/>
  <!-- Bıyık -->
  <path d="M40,48 Q44,46 48,47 Q52,46 56,48" fill="none" stroke="#2A1810" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gözler (sert bakış) -->
  <ellipse cx="42" cy="42" rx="1.6" ry="1" fill="#1A0E08"/>
  <ellipse cx="54" cy="42" rx="1.6" ry="1" fill="#1A0E08"/>
  <!-- Kaşlar (kalın, sert) -->
  <path d="M39,38 L46,40" stroke="#1A0E08" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M50,40 L57,38" stroke="#1A0E08" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Burun -->
  <path d="M48,42 L47,49 L49,49" fill="none" stroke="#8B5A2B" stroke-width="0.6"/>

  <!-- Sarık + Altın Taç -->
  <path d="M32,32 Q48,18 64,32 Q60,28 48,26 Q36,28 32,32 Z" fill="#F4E8C8" stroke="#9C7820" stroke-width="0.8"/>
  <!-- Taç (üst) -->
  <path d="M36,28 L40,22 L44,28 L48,20 L52,28 L56,22 L60,28 Z" fill="url(#t-crown)" stroke="#7A5A18" stroke-width="0.8"/>
  <!-- Mücevher merkez -->
  <circle cx="48" cy="26" r="2" fill="#8B1A1A" stroke="#C9A24B" stroke-width="0.5"/>

  <!-- Mühür imzası — sol alt -->
  <text x="20" y="92" font-family="serif" font-size="6" fill="#9C7820" opacity="0.6">۞</text>
</svg>
