<?xml version="1.0" encoding="UTF-8"?>
<!-- Uluğ Bey — Komutan Portresi (minyatür stili)
     Hesaplı astronom: lacivert kaftan, yıldız sembolleri. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Uluğ Bey portresi">
  <defs>
    <radialGradient id="u-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F4E8C8"/>
      <stop offset="60%" stop-color="#E8D5A0"/>
      <stop offset="100%" stop-color="#C9A876"/>
    </radialGradient>
    <linearGradient id="u-robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B4E8F"/>
      <stop offset="100%" stop-color="#1B3A6B"/>
    </linearGradient>
  </defs>

  <!-- Tezhip çerçeve -->
  <circle cx="48" cy="48" r="46" fill="url(#u-bg)" stroke="#9C7820" stroke-width="2"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="#C9A24B" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Yıldız arkaplan motifi (gece gökyüzü hissi) -->
  <g opacity="0.35" fill="#C9A24B">
    <circle cx="20" cy="32" r="0.8"/>
    <circle cx="78" cy="28" r="0.6"/>
    <circle cx="14" cy="50" r="0.5"/>
    <circle cx="84" cy="52" r="0.7"/>
    <circle cx="22" cy="62" r="0.6"/>
    <circle cx="76" cy="64" r="0.5"/>
  </g>

  <!-- Robe / Kaftan (lacivert akademik) -->
  <path d="M16,96 Q16,68 30,60 L66,60 Q80,68 80,96 Z" fill="url(#u-robe)" stroke="#0F2447" stroke-width="1"/>
  <!-- Altın yıldız desenleri kaftan üstünde -->
  <g fill="#F0C770" opacity="0.9">
    <path d="M30,76 L31,79 L34,79 L31.5,81 L32.5,84 L30,82 L27.5,84 L28.5,81 L26,79 L29,79 Z" transform="scale(0.5) translate(48,76)"/>
    <path d="M65,76 L66,79 L69,79 L66.5,81 L67.5,84 L65,82 L62.5,84 L63.5,81 L61,79 L64,79 Z" transform="scale(0.5) translate(80,76)"/>
  </g>
  <!-- Kaftan altın şeritleri -->
  <path d="M30,72 Q48,76 66,72" fill="none" stroke="#C9A24B" stroke-width="1.2"/>

  <!-- Astrolab elementi (sol omuzda) -->
  <g transform="translate(22,58)">
    <circle cx="0" cy="0" r="4.5" fill="none" stroke="#C9A24B" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="2" fill="none" stroke="#C9A24B" stroke-width="0.5"/>
    <path d="M-4.5,0 L4.5,0 M0,-4.5 L0,4.5" stroke="#C9A24B" stroke-width="0.4"/>
  </g>

  <!-- Yüz -->
  <ellipse cx="48" cy="45" rx="15" ry="17" fill="#E5C5A0" stroke="#8B5A2B" stroke-width="0.6"/>
  <!-- Sakal (orta, düzgün — alim) -->
  <path d="M38,52 Q42,64 48,67 Q54,64 58,52 Q54,56 48,57 Q42,56 38,52 Z" fill="#5A4030" stroke="#3A2A1C" stroke-width="0.4"/>
  <!-- Bıyık -->
  <path d="M40,48 Q44,46 48,47 Q52,46 56,48" fill="none" stroke="#5A4030" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Gözler (düşünceli, sakin) -->
  <ellipse cx="42" cy="42" rx="1.4" ry="1" fill="#1A0E08"/>
  <ellipse cx="54" cy="42" rx="1.4" ry="1" fill="#1A0E08"/>
  <!-- Kaşlar (düz, sakin) -->
  <path d="M39,38 L46,39" stroke="#3A2A1C" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M50,39 L57,38" stroke="#3A2A1C" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Burun -->
  <path d="M48,42 L47,49 L49,49" fill="none" stroke="#8B5A2B" stroke-width="0.6"/>

  <!-- Sarık (lacivert, alim) -->
  <path d="M32,32 Q48,16 64,32 Q60,26 48,24 Q36,26 32,32 Z" fill="#1B3A6B" stroke="#0F2447" stroke-width="0.8"/>
  <!-- Sarık üzerinde altın yıldız -->
  <path d="M48,22 L48.8,24 L51,24 L49.2,25.4 L50,27.6 L48,26.2 L46,27.6 L46.8,25.4 L45,24 L47.2,24 Z" fill="#F0C770" stroke="#7A5A18" stroke-width="0.3"/>

  <!-- Mühür imzası -->
  <text x="20" y="92" font-family="serif" font-size="6" fill="#9C7820" opacity="0.6">۞</text>
</svg>
