<?xml version="1.0" encoding="UTF-8"?>
<!-- Yıldırım Bayezid — Komutan Portresi (minyatür stili)
     Cesur saldırgan: ateşli kırmızı kaftan, kıvrık kılıç. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Bayezid portresi">
  <defs>
    <radialGradient id="b-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F4E8C8"/>
      <stop offset="60%" stop-color="#E8D5A0"/>
      <stop offset="100%" stop-color="#C9A876"/>
    </radialGradient>
    <linearGradient id="b-robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A52A2A"/>
      <stop offset="100%" stop-color="#6E1A1A"/>
    </linearGradient>
    <linearGradient id="b-sword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6E6E6"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
  </defs>

  <!-- Tezhip çerçeve -->
  <circle cx="48" cy="48" r="46" fill="url(#b-bg)" stroke="#9C7820" stroke-width="2"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="#C9A24B" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Kılıç (arka plan, omuz üzerinde) -->
  <path d="M70,18 L78,10 L82,14 L74,22 Z" fill="#F0C770" stroke="#7A5A18" stroke-width="0.6"/>
  <path d="M30,72 Q52,42 74,22" stroke="url(#b-sword)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M28,74 L36,70 L34,76 Z" fill="#C9A24B" stroke="#7A5A18" stroke-width="0.6"/>

  <!-- Robe / Kaftan -->
  <path d="M16,96 Q16,68 30,60 L66,60 Q80,68 80,96 Z" fill="url(#b-robe)" stroke="#3A0D0D" stroke-width="1"/>
  <!-- Çapraz pazubant -->
  <path d="M22,68 L74,90" stroke="#C9A24B" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- Kemer altın -->
  <rect x="20" y="80" width="60" height="3" fill="#C9A24B" opacity="0.6"/>

  <!-- Yüz -->
  <ellipse cx="48" cy="45" rx="15" ry="17" fill="#E5C5A0" stroke="#8B5A2B" stroke-width="0.6"/>
  <!-- Sakal (kısa, sivri) -->
  <path d="M40,53 Q44,62 48,64 Q52,62 56,53 Q52,57 48,57 Q44,57 40,53 Z" fill="#3A1810" stroke="#1A0E08" stroke-width="0.4"/>
  <!-- Bıyık (kıvrık) -->
  <path d="M40,48 Q42,46 47,47 Q49,46 50,47 Q53,46 56,48" fill="none" stroke="#3A1810" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gözler (cesur, geniş) -->
  <ellipse cx="42" cy="42" rx="1.8" ry="1.2" fill="#1A0E08"/>
  <ellipse cx="54" cy="42" rx="1.8" ry="1.2" fill="#1A0E08"/>
  <!-- Kaşlar (kalın, savaş çağrısı) -->
  <path d="M39,38 L46,41" stroke="#1A0E08" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M50,41 L57,38" stroke="#1A0E08" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Burun -->
  <path d="M48,42 L47,49 L49,49" fill="none" stroke="#8B5A2B" stroke-width="0.6"/>

  <!-- Sarık (kırmızı, savaşçı) -->
  <path d="M32,32 Q48,16 64,32 Q60,26 48,24 Q36,26 32,32 Z" fill="#A52A2A" stroke="#5B1616" stroke-width="0.8"/>
  <!-- Sorguç (tüy) -->
  <path d="M48,24 L48,12 L50,16 L48,12 L46,16 Z" fill="#F0C770" stroke="#7A5A18" stroke-width="0.5"/>
  <circle cx="48" cy="24" r="2" fill="#C9A24B" stroke="#7A5A18" stroke-width="0.5"/>

  <!-- Mühür imzası -->
  <text x="20" y="92" font-family="serif" font-size="6" fill="#9C7820" opacity="0.6">۞</text>
</svg>
